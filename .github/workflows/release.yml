name: Release

# Push a tag like v0.2.0 to publish binaries for every platform as a GitHub
# release. install.sh downloads from the latest release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: make test
      - name: build all platforms
        run: make dist VERSION="${GITHUB_REF_NAME}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "brunosync $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Install: see INSTALL.md. Checksums are in SHA256SUMS."
